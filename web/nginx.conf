server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The browser only talks to this origin; nginx forwards API calls to the Supplier service.
  # In a larger system this is where an API gateway (YARP, Kong, Azure API Management) would sit.
  location /api/ {
    proxy_pass http://supplier-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Fingerprinted build assets never change, so cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client side routing: unknown paths get the app, which renders the right page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
