# web: http://localhost:3000  api: http://localhost:5080/scalar
name: travelogic

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Travelogic!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  supplier-api:
    build:
      context: ./services/supplier
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SuppliersDb: "Server=sqlserver,1433;Database=TravelogicSuppliers;User Id=sa;Password=${SQL_SA_PASSWORD:-Travelogic!Passw0rd};TrustServerCertificate=True;Encrypt=True"
      Database__MigrateOnStartup: "true"
      Database__SeedSampleData: "true"
      OpenApi__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    # no curl in the aspnet image
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      supplier-api:
        condition: service_healthy

volumes:
  sqlserver-data:
